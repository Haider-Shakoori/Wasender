name: Hotfix dependency and style repair

on:
  push:
    branches:
      - hotfix-whatsapp-runtime-permissions
    paths:
      - .github/workflows/repair-hotfix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-whatsapp-runtime-permissions
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Upgrade vulnerable PHP dependencies
        run: composer update laravel/framework league/commonmark league/flysystem league/flysystem-local --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Apply Laravel Pint
        run: vendor/bin/pint
      - name: Commit generated repair
        run: |
          if git diff --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock app routes tests
          git commit -m "ci: refresh patched dependencies and formatting"
          git push origin HEAD:hotfix-whatsapp-runtime-permissions
