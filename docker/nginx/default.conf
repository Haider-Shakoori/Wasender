server {
    resolver 127.0.0.11 valid=10s ipv6=off;
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 26m;
    autoindex off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        set $app_upstream app:9000;
        fastcgi_pass $app_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # Preserve the outer HTTPS scheme when a trusted reverse proxy supplied it,
        # but always provide a non-empty forwarded host. Empty X-Forwarded-Host
        # values cause Symfony's trusted-proxy host parsing to fail on internal callbacks.
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:env|log|sql|sqlite|bak|ini)$ {
        deny all;
    }
}
